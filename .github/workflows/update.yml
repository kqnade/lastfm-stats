name: Update Last.fm Stats

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: # manual trigger

permissions:
  contents: write

concurrency:
  group: lastfm-stats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Restore image and history cache
        uses: actions/cache@v6
        with:
          path: .cache/
          key: lastfm-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lastfm-v1-${{ runner.os }}-${{ github.ref_name }}-

      - run: npm ci

      - name: Generate SVGs
        run: npm run generate
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USERNAME: ${{ secrets.LASTFM_USERNAME }}
          LASTFM_PERIOD: "7day"
          LASTFM_THEME: "dark"
          LASTFM_TIMEZONE: "Asia/Tokyo"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update Last.fm stats SVGs"
            git push
          fi
